name: Fetch Finnhub earnings data

# SCHEDULE DISABLED (2026-08-18): this fed the daily Market Map / Shark Tank refresh,
# which was turned off by request — only Open Book still refreshes daily. Runs on
# manual dispatch only. To re-enable, restore the `schedule:` block below:
#   schedule:
#     # 6am UTC Mon–Fri  (= 7am BST in summer, 6am GMT in winter)
#     - cron: '0 6 * * 1-5'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Finnhub earnings data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_earnings.py

      - name: Commit earnings_data.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_data.md
          git diff --cached --quiet || git commit -m "chore: update earnings data $(date +%F)" && git push
