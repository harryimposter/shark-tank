name: Fetch Finnhub earnings data

on:
  schedule:
    # 6am UTC Mon–Fri  (= 7am BST in summer, 6am GMT in winter)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    # Manual trigger from GitHub Actions tab — useful for first test

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip installs — fetch_earnings.py uses stdlib only

      - name: Fetch Finnhub earnings data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_earnings.py

      - name: Commit earnings_data.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_data.md
          git diff --cached --quiet || \
            git commit -m "chore: update earnings data $(date +%F)" && \
            git push
